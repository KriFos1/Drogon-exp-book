[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drogon-exp-book"
version = "1.0.0"
description = "Drogon experiments from Subsurface Data Assimilation: Theory and Applications"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Kristian Fossum", email = "krfo@norceresearch.no" }]
dependencies = [
    "PET @ git+https://github.com/Python-Ensemble-Toolbox/PET.git@86d7893097cbdca8e9b09ca1fa41fac320ed1f81",
    "subsurface @ git+https://github.com/Python-Ensemble-Toolbox/SimulatorWrap.git@00f3cc487634c932a69f22d5379a004fb31692bd",
    "open-petro-elastic==1.4.1",
    # SimulatorWrap's Equinor sim2seis loader imports pkg_resources.
    "setuptools<81",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "resdata>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
